services:
  frontend:
    build:
      context: ./frontend
    container_name: withpet-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    container_name: withpet-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: withpet
    depends_on:
      - db
    tty: true
    stdin_open: true

  db:
    image: postgres:16
    container_name: withpet-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: withpet
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: